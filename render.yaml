services:
  - type: web
    name: avio-assig-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && prisma generate --schema=prisma_schema/schema.prisma && prisma py fetch
    startCommand: uvicorn app.main:create_app --factory --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: '["http://localhost:5173","https://complaint-cyan.vercel.app"]'
      - key: DEBUG
        value: "false"
      - key: PYTHON_VERSION
        value: "3.11.11"
